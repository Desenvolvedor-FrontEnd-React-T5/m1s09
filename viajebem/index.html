<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicite seu orçamento | ViajeBem</title>
  </head>
  <body>
    <div>
      <h1>ViajeBem</h1>
      <p>Planeje sua próxima viagem com a gente.</p>
    </div>

    <div>
      <h2>Solicite um orçamento</h2>
      <p>Preencha o formulário e nossa equipe entrará em contato.</p>

      <form action="#" method="post">
        <div>
          <label for="nome">Nome completo:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="name"
            required
          />
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            autocomplete="tel"
            required
          />
        </div>

        <div>
          <label for="destino">Destino:</label>
          <select id="destino" name="destino" required>
            <option value="">Selecione um destino</option>
            <option value="cancun">Cancún</option>
            <option value="fortaleza">Fortaleza</option>
            <option value="natal">Natal</option>
            <option value="nova-york">Nova York</option>
            <option value="miami">Miami</option>
            <option value="paris">Paris</option>
            <option value="toquio">Tóquio</option>
          </select>
        </div>

        <fieldset>
          <legend>Tipo de pacote:</legend>

          <label>
            <input type="radio" name="pacote" value="economico" required />
            Econômico
          </label>

          <label>
            <input type="radio" name="pacote" value="conforto" />
            Conforto
          </label>

          <label>
            <input type="radio" name="pacote" value="premium" />
            Premium
          </label>
        </fieldset>

        <fieldset>
          <legend>Extras:</legend>

          <label>
            <input type="checkbox" name="extras" value="tours-guiados" />
            Tours guiados
          </label>

          <label>
            <input type="checkbox" name="extras" value="seguro-viagem" />
            Seguro viagem
          </label>

          <label>
            <input type="checkbox" name="extras" value="traslado" />
            Traslado
          </label>
        </fieldset>

        <div>
          <label for="data-ida">Data de ida:</label>
          <input type="date" id="data-ida" name="data-ida" required />
        </div>

        <div>
          <label for="data-volta">Data de volta:</label>
          <input type="date" id="data-volta" name="data-volta" required />
        </div>

        <div>
          <label for="observacoes">Observações:</label>
          <textarea
            id="observacoes"
            name="observacoes"
            rows="5"
            placeholder="Conte-nos mais sobre sua viagem."
          ></textarea>
        </div>

        <button type="submit">Solicitar orçamento</button>
      </form>
    </div>
  </body>
</html>
